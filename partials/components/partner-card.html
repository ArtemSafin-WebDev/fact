<article class="partner-card">
    <div class="partner-card__layer partner-card__layer--front">
        <img class="partner-card__logo" src="{{logo.src}}" alt="{{logo.alt}}" loading="lazy">

        <h2 class="partner-card__title">
            {{title}}
        </h2>
    </div>

    <div class="partner-card__layer partner-card__layer--hover" aria-hidden="true">
        <p class="partner-card__description">
            {{description}}
        </p>
    </div>
</article>
