      - generic [ref=e769]:
        - generic [ref=e770]:
          - paragraph [ref=e771]: Современный офтальмологический центр в Пятигорске, объединяющий инновационные методики лечения и профессионализм врачей. Наша клиника специализируется на диагностике, лечении и профилактике заболеваний глаз как у взрослых, так и у детей.
          - paragraph [ref=e772]: "Врачи-офтальмологи центра Факт обладают большим опытом и постоянно совершенствуют квалификацию, внедряя в практику новейшие мировые технологии. Диагностическое отделение оснащено передовым оборудованием: оптическая когерентная томография, цифровая рефрактометрия, автотонометрия, ультразвуковая биометрия, компьютерная периметрия — все для постановки точного диагноза и индивидуального подбора лечения."
          - paragraph [ref=e773]: В клинике Факт доступны все современные виды лазерной коррекции зрения (лазерная коррекция близорукости, дальнозоркости, астигматизма), микрохирургия катаракты с имплантацией мультифокальных и торических линз, лечение глаукомы различными лазерными и хирургическими методами. Наши офтальмологи проводят сложные витреоретинальные операции при патологиях сетчатки и стекловидного тела, выполняют пластические операции на веках, устраняют косоглазие и проводят лечение макулодистрофии.
